<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../scripts/script.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <header>
        <div class="header">
            <button class="menu-toggle">
                <span>☰</span>
            </button>
            <h1 class="title">N.a.s.a</h1>
            <img src="..\images\imgbin_space-shuttle-program-nasa-insignia-logo-png.png" alt="image" class="logo">
        </div>
        <div class="dropdown-menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="schedule.html">Horario</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="contact.html">Contacto</a></li>
            </ul>
        </div>
    </header>
    <main>
        <div class="divfrontpage5">
            <h1>Contacto:</h1>
            <p class="userMessage">
                <!--Mensaje personalizado para el usuario en base a los datos del localstorage-->
            </p>
            <div class="contactform">
                <!--Autocompletado de los campos cuando se cargue la pagina contacto con los datos del user actual-->
                <form>
                    <div class="containerContact">
                        <label for="name">Name:</label>
                        <input type="text" name="nameuser" class="nameuser" placeholder="Ingresa tu nombre" required>
                        <label for="newuser">User:</label>
                        <input type="text" name="newuser" class="newuser" placeholder="Ingresa tu nombre de usuario"
                            required>
                        <label for="telephone">Telephone:</label>
                        <input type="text" name="telephone" class="telephone" placeholder="Ingresa tu teléfono">
                        <label for="email">Email:</label>
                        <input type="email" name="email" class="email" placeholder="Ingresa tu correo electrónico"
                            required>
                        <label for="asunto">Asunto:</label>
                        <input type="asunto" name="asunto" class="asunto" placeholder="Ingresa asunto de contacto"
                            required>
                        <label for="mensaje">Mensaje:</label>
                        <textarea type="mensaje" name="mensaje" class="mensaje" placeholder="Deja aqui tu mensaje"
                            required></textarea>
                    </div>
                    <div class="buttons-contact-group">
                        <input type="submit" name="contact" value="Enviar">
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer class="footer">
        <img src="..\images\imgbin_space-shuttle-program-nasa-insignia-logo-png.png" alt="image" class="logo"
            href="https://www.nasa.gov/">
        <div class="internal-list"> <!-- placeholder para menu footer o lo que sea-->
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="schedule.html">Horario</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="contact.html">Contacto</a></li>
            </ul>
        </div>
        <div class="socialMedia">
            <a href="https://www.facebook.com/NASA" class="text-white me-4">
                <i class="bi bi-facebook"></i>
            </a>
            <a href="https://www.facebook.com/NASA" class="text-white me-4">
                <i class="bi bi-instagram"></i>
            </a>
            <a href="https://x.com/NASA" class="text-white me-4">
                <i class="bi bi-twitter"></i>
            </a>
            <a href="https://www.youtube.com/@NASA" class="text-white">
                <i class="bi bi-youtube"></i>
            </a>
        </div>
    </footer>
</body>

</html>
